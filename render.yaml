# Render Blueprint: nur der Web-Service.
# DATABASE_URL = Internal Database URL deiner bestehenden Render-Postgres
# (die Tabellen heißen ab_users / ab_sessions und stören andere Projekte nicht).
services:
  - type: web
    name: airmanager
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
