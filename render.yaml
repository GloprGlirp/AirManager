# Render Blueprint: Web-Service + kostenlose Postgres-Datenbank für dauerhafte Spielstände
services:
  - type: web
    name: flightline-airbase
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flightline-db
          property: connectionString
databases:
  - name: flightline-db
    plan: free
